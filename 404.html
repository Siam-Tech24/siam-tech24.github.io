<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <script>
        var currentUrl = window.location.href;
        
        // Checks for the lowercase version created by the social media platform
        if (currentUrl.toLowerCase().includes("/nexushub-academy")) {
            // Forces the correct exact capitalization required by GitHub Pages
            var correctUrl = currentUrl.replace(/[\/]nexushub-academy/i, "/NexusHub-Academy");
            window.location.replace(correctUrl);
        } else {
            // Fallback message if a user visits a completely non-existent page
            document.addEventListener("DOMContentLoaded", function() {
                document.body.innerHTML = "<div style='text-align:center; margin-top:50px; font-family:sans-serif;'><h1>404 - Page Not Found</h1><p>The page you are looking for does not exist.</p><a href='https://Siam-Tech24.github.io/NexusHub-Academy/'>Go to NexusHub Academy Home</a></div>";
            });
        }
    </script>
</head>
<body>
    <div style="text-align:center; margin-top:50px; font-family:sans-serif;">
        <p>Redirecting you to the correct page...</p>
    </div>
</body>
</html>
